services:
  mongodb:
    image: mongo:8
    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}

    ports:
      - "27018:27017"

    volumes:
      - mongodb-data:/data/db

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--username",
          "${MONGO_USERNAME}",
          "--password",
          "${MONGO_PASSWORD}",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.adminCommand('ping').ok"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}

    ports:
      - "5672:5672"
      - "15672:15672"

    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  design-api:
    build:
      context: ./design-api
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      MONGODB_URI: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongodb:27017/design_db?authSource=admin
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      JWT_SIGNER_KEY: ${JWT_SIGNER_KEY}

    ports:
      - "9999:9999"

    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  playwright-worker:
    build:
      context: ./playwright-worker
      dockerfile: Dockerfile

    restart: unless-stopped
    init: true

    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USERNAME}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      CRAWL_EXCHANGE: design.crawl.exchange
      CRAWL_REQUESTED_QUEUE: design.crawl.requested.queue
      CRAWL_REQUESTED_ROUTING_KEY: crawl.requested
      CRAWL_COMPLETED_ROUTING_KEY: crawl.completed
      CRAWL_FAILED_ROUTING_KEY: crawl.failed
      CRAWL_DEAD_LETTER_EXCHANGE: design.crawl.dlx
      CRAWL_REQUESTED_DLQ: design.crawl.requested.dlq
      CRAWL_REQUESTED_DEAD_LETTER_ROUTING_KEY: crawl.requested.dead
      MAX_CRAWL_PAGES: 11
      NAVIGATION_TIMEOUT_MS: 30000
      CRAWL_JOB_TIMEOUT_MS: 120000
      MAX_DOCUMENT_BYTES: 5000000
      CRAWL_RETRY_ATTEMPTS: 3
      PUBLISH_RETRY_ATTEMPTS: 3
      RETRY_BASE_DELAY_MS: 1000
      PUBLISHER_CONFIRM_TIMEOUT_MS: 10000

    depends_on:
      rabbitmq:
        condition: service_healthy

    shm_size: "1gb"
  design-ai-service:
    build:
      context: ./design-ai-service
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USERNAME}:${RABBITMQ_PASSWORD}@rabbitmq:5672

      ANALYSIS_EXCHANGE: design.analysis.exchange
      ANALYSIS_REQUESTED_QUEUE: design.analysis.requested.queue
      ANALYSIS_REQUESTED_ROUTING_KEY: analysis.requested
      ANALYSIS_COMPLETED_ROUTING_KEY: analysis.completed
      ANALYSIS_FAILED_ROUTING_KEY: analysis.failed

      ANALYSIS_DEAD_LETTER_EXCHANGE: design.analysis.dlx
      ANALYSIS_REQUESTED_DEAD_LETTER_ROUTING_KEY: analysis.requested.dead

    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  mongodb-data:
  rabbitmq-data:
